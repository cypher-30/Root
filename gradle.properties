org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# This project currently builds with AGP 9.4.0 and Gradle 9.7.1 (see build.gradle.kts
# and gradle/wrapper/gradle-wrapper.properties). The flags below were carried over
# from an AGP 8.x-era setup and mostly just restore legacy/deprecated behavior
# (legacy variant API, resource-value defaults, etc.) rather than being required for
# a clean build; they are kept because the app currently relies on them and removing
# them is a separate compatibility change, not part of this documentation pass.
android.suppressUnsupportedCompileSdk=36
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
