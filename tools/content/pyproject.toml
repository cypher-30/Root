[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-pipeline"
version = "0.1.0"
description = "Root content editorial/import/build/publish pipeline (Python)."
requires-python = ">=3.10"
# jsonschema validates content/schemas/*.json against fixtures and built
# artifacts (Draft 2020-12). Everything else is standard library: json,
# hashlib, urllib, csv, dataclasses, unittest. Real network discovery for the
# source adapters uses urllib only and always degrades to a structured
# "network unavailable" result rather than fabricating data.
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["jsonschema>=4.20"]

[project.scripts]
content-pipeline = "content_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["content_pipeline*"]
